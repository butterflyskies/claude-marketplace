name: codex-plugin-validation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  bsky-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate manifests
        run: |
          python -m json.tool plugins/bsky-core/.codex-plugin/plugin.json >/dev/null
          python -m json.tool .agents/plugins/marketplace.json >/dev/null
      - name: Run package contract tests
        run: python -m unittest discover -s plugins/bsky-core/tests -v
      - name: Run token audit tests
        run: python -m unittest discover -s plugins/bsky-core/skills/token-audit/tests -v
      - name: Compile bundled scripts
        run: python -c "from pathlib import Path; p=Path('plugins/bsky-core/skills/token-audit/scripts/token_audit.py'); compile(p.read_text(), str(p), 'exec')"
